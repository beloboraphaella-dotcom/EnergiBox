# Mosquitto configuration for EnergiBox.
#
# The default broker this project was developed against allowed anonymous
# connections on 1883 with no ACLs. Anything on the LAN could publish fake
# readings for any MAC, or publish to energibox/<mac>/control and switch a
# 220 V relay, bypassing the API's authentication entirely.
#
# Install:
#   sudo cp mosquitto.conf /etc/mosquitto/conf.d/energibox.conf
#   sudo cp aclfile         /etc/mosquitto/energibox.acl
#   sudo chown root:mosquitto /etc/mosquitto/energibox.acl
#   sudo chmod 640           /etc/mosquitto/energibox.acl
#   sudo systemctl restart mosquitto
#
# Then create the accounts (see README for the full walkthrough):
#   sudo mosquitto_passwd -c /etc/mosquitto/energibox.passwd energibox-backend
#   sudo mosquitto_passwd    /etc/mosquitto/energibox.passwd energibox-device

listener 1883

# The single most important line here: no unauthenticated clients.
allow_anonymous false

password_file /etc/mosquitto/energibox.passwd
acl_file /etc/mosquitto/energibox.acl

# ── TLS ────────────────────────────────────────────────────────────────
# Without TLS the broker password crosses the network in clear text, so
# authentication alone only stops the casual case. Enable this listener
# once the ESP32 firmware carries the CA certificate, then drop the plain
# 1883 listener above.
#
# listener 8883
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key
